<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('stage');
// layout: ?v → vertical 1080x1920 (TikTok, content kept inside UI safe zone), else 1920x1080
const V=location.search.includes('v');
const LY=V?{W:1080,H:1920,FR:36,FY:420,FX:[156,352,656],labY:650,cntY:672,
  s1:[500,470,49],s2:[500,470,18],PX:40,PY:790,PW:920,PH:560,
  YG:[860,945,1015,1085,1170],Y1:[860,935,995,1055,1115,1170,1235,1305],Y2:[860,935,1000,1060,1125,1180,1250,1320],
  subY:1355,subH:115,subF:36,cx:500}
 :{W:1920,H:1080,FR:46,FY:455,FX:[201,432,801],labY:735,cntY:762,
  s1:[570,505,62],s2:[570,505,25],PX:1170,PY:120,PW:690,PH:790,
  YG:[205,300,380,460,560],Y1:[205,290,365,440,515,580,660,780],Y2:[205,290,370,445,525,585,690,800],
  subY:968,subH:112,subF:40,cx:960};
for(const [k,v] of [['width',LY.W],['height',LY.H],['viewBox',`0 0 ${LY.W} ${LY.H}`]])svg.setAttribute(k,v);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
function txt(s,a,p){const e=el('text',a,p);e.textContent=s;return e;}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=p=>1-Math.pow(1-p,3), easeBack=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, bump=p=>Math.sin(Math.PI*clamp(p));
const L=i=>LS[i-1], E=i=>LS[i-1]+LD[i-1];
const C={bg:'#FBF8F1',ink:'#22252B',muted:'#6B6F78',blue:'#3B7DD8',orange:'#E8843B',green:'#2E9E5B',gold:'#F2B33D',goldT:'#B97A0C',red:'#D9473B',panel:'#FFFFFF'};
// ring fills [main, alt-for-sides] and strokes
const RF=[['#F4A261','#F4A261'],['#4DB57A','#8FD3AA'],['#5B95E0','#A3C4F0'],['#F2B33D','#F8D68E']];
const ringCol=k=>k===0?RF[0]:RF[1+((k-1)%3)];
const RTXT=[C.orange,C.green,C.blue,C.goldT];
const STROKE='#1D3557';
// 6 group (sector) hues: each ring k = 6 equal groups of k cells
const HUE=['#E8573B','#F2B33D','#2E9E5B','#3B7DD8','#8E5BD8','#D84B9A'];
const secCol=c=>c.k===0?RF[0][0]:(c.k%2?HUE[c.s]:toHex(mix(HUE[c.s],'#FFFFFF',.55)));

// ---------- hex grid (flat-top, axial coords) ----------
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function cells(n){const out=[{q:0,r:0,k:0,j:0,s:0}];
  for(let k=1;k<=n;k++){let q=DIRS[4][0]*k,r=DIRS[4][1]*k,j=0;
    for(let d=0;d<6;d++)for(let i=0;i<k;i++){out.push({q,r,k,j,s:d});j++;q+=DIRS[d][0];r+=DIRS[d][1];}}
  return out.map(c=>Object.assign(c,{x:1.5*c.q,y:Math.sqrt(3)*(c.r+c.q/2)}));}
const HEXPTS=[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i;return (.95*Math.cos(a)).toFixed(4)+','+(.95*Math.sin(a)).toFixed(4);}).join(' ');
function makeFig(n,parent){const g=el('g',{},parent);
  const cs=cells(n).map(c=>{c.g=el('g',{},g);
    c.poly=el('polygon',{points:HEXPTS,fill:ringCol(c.k)[0],stroke:STROKE,'stroke-width':3,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},c.g);
    return c;});
  return {g,cs};}
function place(c,s){c.g.setAttribute('transform',`translate(${c.x} ${c.y}) scale(${Math.max(s,.001)})`);}
const setT=(g,x,y,R)=>g.setAttribute('transform',`translate(${x} ${y}) scale(${R})`);

// ---------- problem figures ----------
const FR=LY.FR, FY=LY.FY, FX=LY.FX;
const probG=el('g',{});
const figs=[0,1,2].map(n=>{const f=makeFig(n,probG);setT(f.g,FX[n],FY,FR);return f;});
const figLab=[0,1,2].map(n=>{const g=el('g',{opacity:0},probG);
  txt('Hình '+(n+1),{x:FX[n],y:LY.labY,'font-size':V?40:44,'font-weight':800,fill:C.ink,'text-anchor':'middle'},g);return g;});
const figCnt=['1 hình','7 hình','19 hình'].map((s,n)=>{const g=el('g',{opacity:0},probG);
  el('rect',{x:FX[n]-80,y:LY.cntY,width:160,height:58,rx:29,fill:RTXT[n]},g);
  txt(s,{x:FX[n],y:LY.cntY+41,'font-size':V?32:36,'font-weight':800,fill:'#fff','text-anchor':'middle'},g);return g;});

// ---------- main figure (up to figure 10 = 9 rings) ----------
const M=makeFig(9);
// labels inside cells: counting numbers (step 1) and ring index (step 2)
M.cs.forEach(c=>{c.num=txt(String(c.k===0?1:c.j+1),{x:0,y:.24,'font-size':.66,'font-weight':800,fill:'#fff','text-anchor':'middle',opacity:0},c.g);
  if(c.k>0&&c.q===c.k&&c.r===-c.k)c.ring=txt(String(c.k),{x:0,y:.32,'font-size':.9,'font-weight':800,fill:STROKE,'text-anchor':'middle',opacity:0},c.g);});
// group direction (unit vector from centre to the group's centroid) + group badges for rings 2 and 3
M.cs.forEach(c=>{if(!c.k)return;const g=M.cs.filter(d=>d.k===c.k&&d.s===c.s);
  const mx=g.reduce((a,d)=>a+d.x,0)/g.length,my=g.reduce((a,d)=>a+d.y,0)/g.length,n=Math.hypot(mx,my);
  Object.assign(c,{ux:mx/n,uy:my/n,gn:n});});
function badges(k){return [0,1,2,3,4,5].map(s=>{const c=M.cs.find(d=>d.k===k&&d.s===s);
  const g=el('g',{opacity:0},M.g);el('circle',{cx:0,cy:0,r:.5,fill:'#fff',stroke:HUE[s],'stroke-width':4,'vector-effect':'non-scaling-stroke'},g);
  txt(String(k),{x:0,y:.24,'font-size':.68,'font-weight':800,fill:HUE[s],'text-anchor':'middle'},g);
  return {g,ux:c.ux,uy:c.uy,n:c.gn};});}
const B2=badges(2),B3=badges(3);

// ---------- right panel ----------
const PX=LY.PX,PW=LY.PW;
const panel=el('g',{opacity:0});
el('rect',{x:PX,y:LY.PY,width:PW,height:LY.PH,rx:28,fill:C.panel,stroke:'#E8E3D8','stroke-width':3},panel);
const items=[];
function item(g,t0,t1){items.push({g,t0,t1});g.setAttribute('opacity',0);return g;}
function ptext(s,y,t0,t1,o={}){const g=el('g',{},panel);
  if(o.box){el('rect',{x:PX+30,y:y-50,width:PW-60,height:74,rx:16,fill:o.box},g);}
  txt(s,{x:PX+50,y,'font-size':o.size||36,'font-weight':o.w||400,fill:o.color||C.ink},g);return item(g,t0,t1);}
function header(s,y,t0,t1,color){const g=el('g',{},panel);
  el('rect',{x:PX+30,y:y-50,width:230,height:66,rx:33,fill:color},g);
  txt(s,{x:PX+145,y:y-5,'font-size':38,'font-weight':800,fill:'#fff','text-anchor':'middle'},g);return item(g,t0,t1);}
// given
const g2=L(6)-.3;
header('Đề bài',LY.YG[0],L(2),g2,C.ink);
ptext('Hình 1: 1 hình',LY.YG[1],L(2)+1,g2,{w:700});
ptext('Hình 2: 1 + 6 = 7 hình',LY.YG[2],L(3)+4.4,g2,{w:700});
ptext('Hình 3: 19 hình',LY.YG[3],L(4)+4.6,g2,{w:700});
ptext('Hình 10: ? hình',LY.YG[4],L(5)+.3,g2,{w:800,size:40,color:C.green,box:'#E3F5EA'});
// step 1
const s1=L(6),s1e=L(10)-.3;
header('Bước 1',LY.Y1[0],s1,s1e,C.blue);
ptext('Đếm theo từng vòng',LY.Y1[1],s1+.8,s1e,{size:34,color:C.muted});
ptext('Ở giữa: 1 hình',LY.Y1[2],s1+2.5,s1e,{w:700,color:C.orange});
ptext('Vòng 1: 6 hình',LY.Y1[3],L(7)+.3,s1e,{w:700,color:C.green});
ptext('Vòng 2: 12 hình',LY.Y1[4],L(7)+2.6,s1e,{w:700,color:C.blue});
ptext('  (6 nhóm × 2 hình = 12)',LY.Y1[5],L(8)+7.6,s1e,{size:32,color:C.blue});
ptext('Vòng 3: 6 nhóm × 3 = 18 hình',LY.Y1[6],L(9)+4.5,s1e,{w:700,color:C.goldT});
ptext('Mỗi vòng thêm 6 hình!',LY.Y1[7],L(9)+7.5,s1e,{w:800,size:38,box:'#FFF1D6'});
// step 2
const s2=L(10),s2e=L(16)-.3;
header('Bước 2',LY.Y2[0],s2,s2e,C.green);
ptext('Hình 10 = 1 hình giữa + 9 vòng',LY.Y2[1],s2+1.2,s2e,{w:700,size:34});
ptext('1 + 6×1 + 6×2 + … + 6×9',LY.Y2[2],L(11)+.6,s2e,{size:35});
ptext('= 1 + 6 × (1 + 2 + … + 9)',LY.Y2[3],L(12)+1.2,s2e,{size:35,w:700});
ptext('1 + 2 + … + 9',LY.Y2[4],L(13)+.6,s2e,{size:34,color:C.muted});
ptext('= (1 + 9) × 9 : 2 = 45',LY.Y2[5],L(13)+2.6,s2e,{size:34,w:700,color:C.blue});
ptext('1 + 6 × 45 = 1 + 270 = 271',LY.Y2[6],L(14)+1,s2e,{size:38,w:800,color:C.green,box:'#E3F5EA'});
ptext('Thử lại hình 3: 1 + 6 × 3 = 19 ✓',LY.Y2[7],L(15)+1.5,s2e,{size:32,w:700,color:C.goldT});

// ---------- title & answer cards ----------
const title=el('g',{}), CX=LY.cx;
el('rect',{x:0,y:0,width:LY.W,height:LY.H,fill:C.bg},title);
if(V){ // TikTok cover: question + the three given figures + monkey (drawn later)
  txt('TOÁN LỚP 5 · TÌM QUY LUẬT',{x:CX,y:250,'font-size':40,'font-weight':700,fill:C.orange,'text-anchor':'middle','letter-spacing':5},title);
  const q1=txt('',{x:CX,y:370,'font-size':72,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  [['Hình thứ ',C.ink],['10',C.orange],[' có bao nhiêu',C.ink]].forEach(([w,f])=>{const ts=el('tspan',{fill:f},q1);ts.textContent=w;});
  txt('hình lục giác?',{x:CX,y:462,'font-size':72,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  const CFX=[209,398,689];
  [0,1,2].forEach(n=>{const f=makeFig(n,title);setT(f.g,CFX[n],680,34);f.cs.forEach(c=>place(c,1));
    txt('Hình '+(n+1),{x:CFX[n],y:890,'font-size':42,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
    el('rect',{x:CFX[n]-82,y:910,width:164,height:58,rx:29,fill:RTXT[n]},title);
    txt(['1 hình','7 hình','19 hình'][n],{x:CFX[n],y:951,'font-size':32,'font-weight':800,fill:'#fff','text-anchor':'middle'},title);});}
else{txt('TOÁN LỚP 5',{x:CX,y:330,'font-size':44,'font-weight':700,fill:C.orange,'text-anchor':'middle','letter-spacing':8},title);
  txt('Quy luật hình lục giác',{x:CX,y:450,'font-size':110,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  txt('Hình thứ 10 có bao nhiêu hình lục giác?',{x:CX,y:550,'font-size':46,fill:C.muted,'text-anchor':'middle'},title);}
const tFig=makeFig(1,V?el('g',{display:'none'},title):title), tFigY=V?1180:770, tFigR=V?60:52;
const ans=el('g',{opacity:0});
el('rect',{x:0,y:0,width:LY.W,height:LY.H,fill:C.bg,opacity:.94},ans);
const ansCard=el('g',{},ans), ACY=V?700:450, AW=V?820:1000;
el('rect',{x:CX-AW/2,y:ACY-220,width:AW,height:440,rx:40,fill:'#fff',stroke:C.green,'stroke-width':8},ansCard);
txt('Đáp số',{x:CX,y:ACY-100,'font-size':56,'font-weight':700,fill:C.muted,'text-anchor':'middle'},ansCard);
txt('271',{x:CX,y:ACY+70,'font-size':150,'font-weight':800,fill:C.green,'text-anchor':'middle'},ansCard);
txt('hình lục giác',{x:CX,y:ACY+160,'font-size':56,'font-weight':700,fill:C.ink,'text-anchor':'middle'},ansCard);
const tip=el('g',{opacity:0},ans), TY=V?1010:775;
if(V){el('rect',{x:CX-430,y:TY-75,width:860,height:170,rx:50,fill:C.gold},tip);
  txt('💡 Đếm theo vòng –',{x:CX,y:TY-5,'font-size':48,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);
  txt('mỗi vòng thêm 6 hình!',{x:CX,y:TY+60,'font-size':48,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);}
else{el('rect',{x:360,y:720,width:1200,height:110,rx:55,fill:C.gold},tip);
  txt('💡 Đếm theo vòng – mỗi vòng thêm 6 hình!',{x:960,y:793,'font-size':50,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);}


// ---------- monkey teaching assistant (TikTok version only) ----------
const MK={brown:'#8A5A33',dark:'#5E3B1F',tan:'#F1CFA4',pink:'#F29C9C'};
const mon=el('g',{display:V?'inline':'none'});
const monJ=el('g',{},mon);              // jump / bounce
const tailG=el('g',{},monJ);
el('path',{d:'M22,-30 C95,-25 105,-115 62,-122 C34,-126 32,-94 56,-96',fill:'none',stroke:MK.brown,'stroke-width':12,'stroke-linecap':'round'},tailG);
const legs=[-24,24].map(x=>{const g=el('g',{},monJ);el('rect',{x:-11,y:-12,width:22,height:52,rx:11,fill:MK.brown},g);
  el('ellipse',{cx:0,cy:40,rx:15,ry:10,fill:MK.tan},g);return {g,x};});
el('ellipse',{cx:0,cy:-55,rx:48,ry:60,fill:MK.brown},monJ);
el('ellipse',{cx:0,cy:-45,rx:31,ry:41,fill:MK.tan},monJ);
// props (drawn in hand space; hand at origin, arm points along +y)
function prop(kind,p){const g=el('g',{display:'none'},p);
  if(kind==='pointer'){el('line',{x1:0,y1:0,x2:0,y2:150,stroke:'#9C6B3E','stroke-width':7,'stroke-linecap':'round'},g);el('circle',{cx:0,cy:152,r:8,fill:C.red},g);}
  if(kind==='glass'){el('line',{x1:0,y1:0,x2:0,y2:34,stroke:'#3A3A3A','stroke-width':10,'stroke-linecap':'round'},g);
    el('circle',{cx:0,cy:66,r:31,fill:'rgba(190,225,255,.55)',stroke:'#3A3A3A','stroke-width':8},g);el('path',{d:'M-14,52 Q-6,44 4,46',fill:'none',stroke:'#fff','stroke-width':5,'stroke-linecap':'round'},g);}
  if(kind==='pencil'){el('rect',{x:-7,y:-10,width:14,height:62,fill:C.gold,stroke:MK.dark,'stroke-width':2},g);el('polygon',{points:'-7,52 7,52 0,72',fill:MK.tan,stroke:MK.dark,'stroke-width':2},g);
    el('rect',{x:-7,y:-20,width:14,height:11,fill:C.red},g);}
  // upright props: counter-rotated each frame
  if(kind==='sign'){const u=el('g',{class:'up'},g);el('line',{x1:0,y1:0,x2:0,y2:-30,stroke:'#9C6B3E','stroke-width':8},u);
    el('rect',{x:-55,y:-140,width:110,height:110,rx:18,fill:'#fff',stroke:C.orange,'stroke-width':7},u);txt('?',{x:0,y:-55,'font-size':88,'font-weight':800,fill:C.orange,'text-anchor':'middle'},u);}
  if(kind==='banana'){const u=el('g',{class:'up'},g);el('path',{d:'M-30,-40 Q-38,10 10,22 Q40,26 46,8 Q8,10 -6,-28 Z',fill:'#FFD84A',stroke:'#C99A12','stroke-width':4,'stroke-linejoin':'round'},u);
    el('rect',{x:-36,y:-50,width:10,height:14,rx:3,fill:'#7A5A1A'},u);}
  if(kind==='check'){const u=el('g',{class:'up'},g);el('circle',{cx:0,cy:-30,r:30,fill:C.green},u);el('path',{d:'M-14,-30 l9,10 l18,-20',fill:'none',stroke:'#fff','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'},u);}
  return g;}
function arm(sx){const g=el('g',{},monJ);el('line',{x1:0,y1:0,x2:0,y2:62,stroke:MK.brown,'stroke-width':19,'stroke-linecap':'round'},g);
  const hand=el('g',{transform:'translate(0 66)'},g);const props={};
  for(const k of ['pointer','glass','pencil','sign','banana','check'])props[k]=prop(k,hand);
  el('circle',{cx:0,cy:0,r:13,fill:MK.tan},hand);return {g,sx,props};}
const armL=arm(-38),armR=arm(38);
const head=el('g',{},monJ);
[-52,52].forEach(x=>{el('circle',{cx:x,cy:0,r:21,fill:MK.brown},head);el('circle',{cx:x,cy:0,r:11,fill:MK.tan},head);});
el('circle',{cx:0,cy:0,r:52,fill:MK.brown},head);
el('path',{d:'M-10,-50 Q-4,-70 4,-52 Q10,-68 14,-49',fill:MK.brown,stroke:MK.brown,'stroke-width':6,'stroke-linejoin':'round'},head);
el('ellipse',{cx:-17,cy:-6,rx:21,ry:23,fill:MK.tan},head);el('ellipse',{cx:17,cy:-6,rx:21,ry:23,fill:MK.tan},head);
el('ellipse',{cx:0,cy:18,rx:33,ry:23,fill:MK.tan},head);
[-31,31].forEach(x=>el('circle',{cx:x,cy:17,r:8,fill:MK.pink,opacity:.6},head));
const eyes=[-17,17].map(x=>{const g=el('g',{},head);el('ellipse',{cx:0,cy:0,rx:10,ry:12,fill:'#fff'},g);
  const pu=el('g',{},g);el('circle',{cx:0,cy:0,r:6,fill:'#1E1E1E'},pu);el('circle',{cx:2,cy:-2,r:2,fill:'#fff'},pu);return {g,pu,x};});
[-4,4].forEach(x=>el('circle',{cx:x,cy:10,r:2.3,fill:MK.dark},head));
const smile=el('path',{d:'M-13,22 Q0,33 13,22',fill:'none',stroke:MK.dark,'stroke-width':3.5,'stroke-linecap':'round'},head);
const mouthO=el('ellipse',{cx:0,cy:26,rx:10,ry:8,fill:'#A63A3A'},head);
const thinkQ=el('g',{},monJ);
[[62,-232,26,26],[96,-276,34,38]].forEach(([x,y,r,f])=>{el('circle',{cx:x,cy:y,r,fill:'#fff',stroke:C.blue,'stroke-width':4},thinkQ);
  txt('?',{x,y:y+f*.36,'font-size':f,'font-weight':800,fill:C.blue,'text-anchor':'middle'},thinkQ);});
const speech=el('g',{},mon);
el('rect',{x:70,y:-300,width:300,height:76,rx:38,fill:'#fff',stroke:C.ink,'stroke-width':4},speech);
el('path',{d:'M110,-226 L90,-196 L140,-226',fill:'#fff',stroke:C.ink,'stroke-width':4,'stroke-linejoin':'round'},speech);
el('rect',{x:105,y:-229,width:40,height:6,fill:'#fff'},speech);
txt('Cùng giải nhé!',{x:220,y:-250,'font-size':34,'font-weight':800,fill:C.ink,'text-anchor':'middle'},speech);
// confetti for the answer page
const conf=el('g',{display:V?'inline':'none'},ans);ans.insertBefore(conf,ansCard);
const CONF=[...Array(46)].map((_,i)=>{const r=Math.sin(i*12.9898)*43758.5453,f=r-Math.floor(r);
  return {x:40+((i*197)%1000),d:.55+f*.6,ph:i*.37,c:[C.red,C.gold,C.green,C.blue,'#8E5BD8','#D84B9A'][i%6],e:el('rect',{x:-7,y:-12,width:14,height:24,rx:3,fill:[C.red,C.gold,C.green,C.blue,'#8E5BD8','#D84B9A'][i%6]},conf)};});

const POS={cover:[470,1370,1.15],perch:[862,798,.8],ans:[500,1312,.85]};
const figC=n=>[LY.FX[n],LY.FY], mainC=()=>[LY.s1[0],LY.s1[1]];
function aimAt(tx,ty,mx,my,ms,sx){const dx=tx-(mx+ms*sx),dy=ty-(my-ms*90);return Math.atan2(-dx,dy)*180/Math.PI;}
function pose(n,t,P){const w=Math.sin(t*9);
  switch(n){
    case 'wave':return {aL:150,aR:-140+22*w,pL:'sign',pR:'',mo:.7,j:0,lx:0,ly:-1,tilt:4*w,q:0};
    case 'point':{const i=t<L(3)-.2?0:t<L(4)-.2?1:2,[fx,fy]=figC(i);return {aL:aimAt(fx,fy,...P,-38),aR:18,pL:'pointer',pR:'',mo:0,j:0,lx:-4,ly:0,tilt:-4,q:0};}
    case 'think':return {aL:12,aR:128,pL:'',pR:'',mo:0,j:0,lx:3,ly:-4,tilt:9,q:1};
    case 'inspect':{const [fx,fy]=mainC();return {aL:aimAt(fx,fy,...P,-38)+6*Math.sin(t*1.7),aR:20,pL:'glass',pR:'',mo:0,j:0,lx:-4,ly:1,tilt:-5,q:0};}
    case 'cheer':return {aL:158+10*w,aR:-158-10*w,pL:'',pR:'',mo:1,j:1,lx:0,ly:-2,tilt:0,q:0};
    case 'write':return {aL:14,aR:38+9*Math.sin(t*13),pL:'',pR:'pencil',mo:0,j:0,lx:-1,ly:4,tilt:-7,q:0};
    case 'thumb':return {aL:14,aR:-150,pL:'',pR:'check',mo:.6,j:0,lx:0,ly:0,tilt:5,q:0};
    case 'party':return {aL:150+18*w,aR:-150,pL:'',pR:'banana',mo:1,j:1,lx:0,ly:-2,tilt:5*w,q:0};}}
function monkey(t){
  if(!V)return;
  // position: cover → perch on the panel → answer page
  const pa=easeIO(seg(t,L(2)-.7,L(2)-.1)),pb=easeIO(seg(t,L(16)-.3,L(16)+.5));
  const P=[0,1,2].map(i=>lerp(lerp(POS.cover[i],POS.perch[i],pa),POS.ans[i],pb));
  const SEQ=[[0,'wave'],[L(2)-.4,'point'],[L(5),'think'],[L(6),'inspect'],[L(8)+5,'cheer'],[L(8)+10.3,'inspect'],[L(9)+2.6,'cheer'],
    [L(9)+7,'inspect'],[L(10),'write'],[L(14)+.8,'cheer'],[E(14),'write'],[L(15),'thumb'],[L(16)-.2,'party']];
  let i=0;while(i+1<SEQ.length&&t>=SEQ[i+1][0])i++;
  const cur=pose(SEQ[i][1],t,P),prev=i?pose(SEQ[i-1][1],t,P):cur,b=easeIO(seg(t,SEQ[i][0],SEQ[i][0]+.4));
  const v=k=>lerp(prev[k],cur[k],b),pk=k=>b<.5?prev[k]:cur[k];
  const jy=-Math.abs(Math.sin(t*7))*26*v('j');
  mon.setAttribute('transform',`translate(${P[0]} ${P[1]}) scale(${P[2]})`);
  monJ.setAttribute('transform',`translate(0 ${jy})`);
  tailG.setAttribute('transform',`rotate(${8*Math.sin(t*2.2)} 22 -30)`);
  legs.forEach((l,k)=>l.g.setAttribute('transform',`translate(${l.x} 0) rotate(${(k?1:-1)*10*Math.sin(t*3)*(1-pb)+(pb?0:0)})`));
  for(const [A,ang,pr] of [[armL,v('aL'),pk('pL')],[armR,v('aR'),pk('pR')]]){
    A.g.setAttribute('transform',`translate(${A.sx} -90) rotate(${ang})`);
    for(const k in A.props){const on=k===pr;A.props[k].setAttribute('display',on?'inline':'none');
      if(on){const u=A.props[k].querySelector('.up');if(u)u.setAttribute('transform',`rotate(${-ang})`);}}}
  head.setAttribute('transform',`translate(0 -150) rotate(${v('tilt')})`);
  const blink=((t+1.6)%3.3)<.14?.1:1;
  eyes.forEach(e=>{e.g.setAttribute('transform',`translate(${e.x} -6) scale(1 ${blink})`);e.pu.setAttribute('transform',`translate(${v('lx')} ${v('ly')})`);});
  const mo=v('mo');smile.setAttribute('opacity',1-mo);mouthO.setAttribute('opacity',mo);mouthO.setAttribute('ry',3+6*mo);
  thinkQ.setAttribute('opacity',v('q'));thinkQ.setAttribute('transform',`translate(0 ${-6*Math.sin(t*3)})`);
  speech.setAttribute('opacity',1-seg(t,L(2)-1,L(2)-.6));
  // confetti
  const tc=t-L(16);
  CONF.forEach(c=>{const y=-40+((tc*c.d*420+c.ph*300)%1500);c.e.setAttribute('transform',`translate(${c.x+30*Math.sin(tc*2+c.ph)} ${y}) rotate(${tc*200*c.d+c.ph*90})`);});
}

// ---------- subtitles ----------
const sub=el('g',{});
el('rect',V?{x:LY.PX,y:LY.subY,width:LY.PW,height:LY.subH,rx:24,fill:'#22252B',opacity:.9}:{x:0,y:LY.subY,width:LY.W,height:LY.subH,fill:'#22252B',opacity:.9},sub);
const subT=txt('',{x:V?LY.PX+LY.PW/2:960,y:0,'font-size':LY.subF,'font-weight':700,fill:'#fff','text-anchor':'middle'},sub);
// vertical: wrap long subtitles onto two lines (split at the space nearest the middle)
function setSub(str){subT.textContent='';const two=V&&str.length>40;
  let parts=[str];if(two){let m=str.length/2,best=-1,cost=i=>Math.abs(i-m)-(/[:.!?,]/.test(str[i-1])||/[→]/.test(str[i+1])?12:0)+(/[+×]/.test(str[i-1])?12:0);
    for(let i=0;i<str.length;i++)if(str[i]===' '&&(best<0||cost(i)<cost(best)))best=i;parts=[str.slice(0,best),str.slice(best+1)];}
  const lh=LY.subF*1.3,y0=LY.subY+LY.subH/2+LY.subF*.36-(parts.length-1)*lh/2;
  parts.forEach((p,i)=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('x',subT.getAttribute('x'));ts.setAttribute('y',y0+i*lh);ts.textContent=p;subT.appendChild(ts);});}

// ---------- render ----------
const fade=(e,t,a,b,c,d,max=1)=>{let o=easeOut(seg(t,a,a+(b||.5)));if(c!==undefined)o*=1-seg(t,c,c+(d||.5));e.setAttribute('opacity',o*max);};
function pop(e,t,a,cx,cy,c,d){const p=seg(t,a,a+.5);let o=clamp(p*3);if(c!==undefined)o*=1-seg(t,c,c+(d||.5));const s=p>0?easeBack(p):0;
  e.setAttribute('opacity',o);e.setAttribute('transform',`translate(${cx} ${cy}) scale(${Math.max(s,.001)}) translate(${-cx} ${-cy})`);}
const popS=(t,a)=>{const p=seg(t,a,a+.45);return p>0?easeBack(p):0;};
function show(g,on){g.setAttribute('display',on?'inline':'none');}
const lerp=(a,b,p)=>a+(b-a)*p;

function render(t){
  // title
  const to=1-seg(t,L(2)-.6,L(2)-.1);title.setAttribute('opacity',to);show(title,to>0);
  setT(tFig.g,CX,tFigY+Math.sin(t*2)*8,tFigR);
  tFig.cs.forEach(c=>place(c,c.k===0?1:popS(t,.3+c.j*.15)));
  fade(panel,t,L(2)-.2,.6);

  // problem phase
  const mainOn=t>=L(6)-.3;
  const pOut=1-seg(t,L(6)-.3,L(6)+.3);
  probG.setAttribute('opacity',pOut);show(probG,pOut>0);show(figs[2].g,!mainOn);
  figs[0].cs.forEach(c=>place(c,popS(t,L(2)+.3)));
  figs[1].cs.forEach(c=>place(c,c.k===0?popS(t,L(3)):popS(t,L(3)+1.2+c.j*.3)));
  figs[2].cs.forEach(c=>place(c,c.k<2?popS(t,L(4)):popS(t,L(4)+1.4+c.j*.16)));
  [0,1,2].forEach(n=>{fade(figLab[n],t,L(2+n)+.2,.4);pop(figCnt[n],t,n===0?L(2)+1:L(2+n)+4.4,FX[n],LY.cntY+29);});

  // main figure
  show(M.g,mainOn);
  if(mainOn){
    const p1=easeIO(seg(t,L(6)-.3,L(6)+.8)),p2=easeIO(seg(t,L(10)+.2,L(10)+1.4));
    const [ax,ay,ar]=LY.s1,[bx,by,br]=LY.s2;
    // group colouring (gc*) and explode (e*) for rings 2 and 3
    const gc2=s=>seg(t,L(8)+3+s*.3,L(8)+3.3+s*.3)*(1-seg(t,L(9)+.6,L(9)+1.2)), gc3=s=>seg(t,L(9)+1.2+s*.2,L(9)+1.5+s*.2);
    const e2=easeIO(seg(t,L(8)+5,L(8)+5.8))*(1-easeIO(seg(t,L(8)+10.3,L(8)+11))),
          e3=easeIO(seg(t,L(9)+2.6,L(9)+3.4))*(1-easeIO(seg(t,L(9)+7,L(9)+7.8)));
    const p10=seg(t,L(10)+.2,L(10)+1.2), zoom=1-.1*e2-.22*e3;
    setT(M.g,lerp(lerp(FX[2],ax,p1),bx,p2),lerp(lerp(FY,ay,p1),by,p2),lerp(lerp(FR,ar,p1),br,p2)*zoom);
    const dimIn=seg(t,L(6)+2,L(6)+2.5), und=[0,seg(t,L(7)+.3,L(7)+.7),seg(t,L(7)+2.6,L(7)+3)];
    const chk=seg(t,L(15)+.3,L(15)+.8)*(1-seg(t,L(16)-.3,L(16)));
    const pulseRing=t>L(11)+.6&&t<L(11)+6.6?1+Math.floor((t-L(11)-.6)/.66):-1;
    const numOut=1-seg(t,L(8),L(8)+.4);
    for(const c of M.cs){
      let s=1;
      if(c.k===3)s=popS(t,L(9)+.1+c.j*.04);
      else if(c.k>=4)s=popS(t,L(10)+1.6+(c.k-4)*.55+c.j/(6*c.k)*.4);
      if(c.k===0)s*=1+.18*bump(seg(t,L(6)+2.5,L(6)+3.3));
      let o=1;
      if(c.k>=1&&c.k<=2)o=1-.7*clamp(dimIn-und[c.k]);
      if(c.k>=3)o=1-.85*chk;
      c.g.setAttribute('opacity',o);
      const off=(c.k===2?e2:c.k===3?e3:0)*1.3;
      c.g.setAttribute('transform',`translate(${c.x+(c.ux||0)*off} ${c.y+(c.uy||0)*off}) scale(${Math.max(s,.001)})`);
      // ring colour → group hue (step 1) → sector colours for figure 10 (step 2)
      const gA=c.k===2?gc2(c.s):c.k===3?gc3(c.s):0;
      let f=gA>0?mix(ringCol(c.k)[0],HUE[c.s],gA):ringCol(c.k)[0];
      if(p10>0)f=mix(f.startsWith('#')?f:toHex(f),secCol(c),p10);
      c.poly.setAttribute('fill',f);
      const hl=c.k===pulseRing;
      c.poly.setAttribute('stroke',hl?C.red:STROKE);c.poly.setAttribute('stroke-width',hl?4:3);
      // counting numbers
      let no=0;
      if(c.k===0)no=seg(t,L(6)+2.5,L(6)+2.8);
      if(c.k===1)no=seg(t,L(7)+.4+c.j*.22,L(7)+.6+c.j*.22);
      if(c.k===2)no=seg(t,L(7)+2.7+c.j*.14,L(7)+2.9+c.j*.14);
      c.num.setAttribute('opacity',no*numOut);
      if(c.ring)c.ring.setAttribute('opacity',seg(t,L(10)+1.6+Math.max(0,c.k-4)*.55+(c.k<4?(c.k-1)*.3-.6:0)+.3,L(10)+2.4+Math.max(0,c.k-4)*.55+(c.k<4?(c.k-1)*.3-.6:0)));
    }
    const badge=(b,e,t0,t1)=>{pop(b.g,t,t0,0,0,t1,.4);const d=b.n+1.3*e+1.35;
      b.g.setAttribute('transform',`translate(${b.ux*d} ${b.uy*d}) `+b.g.getAttribute('transform'));};
    B2.forEach((b,s)=>badge(b,e2,L(8)+5.9+s*.15,L(8)+10.2));
    B3.forEach((b,s)=>badge(b,e3,L(9)+3.4+s*.15,L(9)+6.9));
  }
  // panel items
  for(const it of items){const p=easeOut(seg(t,it.t0,it.t0+.45)),q=1-seg(t,it.t1,it.t1+.4);
    it.g.setAttribute('opacity',p*q);it.g.setAttribute('transform',`translate(${(1-p)*30} 0)`);}
  // answer
  fade(ans,t,L(16)-.1,.6);
  const ap=seg(t,L(16),L(16)+.7);ansCard.setAttribute('transform',`translate(${CX} ${ACY}) scale(${ap>0?easeBack(ap):.001}) translate(${-CX} ${-ACY})`);
  pop(tip,t,L(16)+5,CX,TY);
  monkey(t);
  // subtitles
  let s='';for(let i=0;i<LS.length;i++)if(t>=LS[i]-.1&&t<LS[i]+LD[i]+.5)s=SUBS[i];
  setSub(s);show(sub,!!s);
}
function toHex(r){return '#'+r.match(/\d+/g).map(v=>(+v).toString(16).padStart(2,'0')).join('');}
function mix(a,b,p){const h=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const x=h(a),y=h(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*p)).join(',')+')';}
render(0);
</script></body></html>
