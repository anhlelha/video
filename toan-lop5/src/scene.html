<body>
<svg id="stage"></svg>
<script src="timings.js"></script>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('stage');
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
function txt(s,a,p){const e=el('text',a,p);e.textContent=s;return e;}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=p=>1-Math.pow(1-p,3), easeBack=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const L=i=>LS[i-1], E=i=>LS[i-1]+LD[i-1];
const C={bg:'#FBF8F1',ink:'#22252B',muted:'#6B6F78',blue:'#3B7DD8',blueF:'#CFE0F7',orange:'#E8843B',orangeF:'#FBDDC4',
  green:'#2E9E5B',greenF:'#C9EBD6',grey:'#E4E2DC',gold:'#F2B33D',red:'#D9473B',panel:'#FFFFFF'};
// layout: ?v → vertical 1080x1920 (TikTok, content kept inside UI safe zone), else 1920x1080
const V=location.search.includes('v');
const LY=V?{W:1080,H:1920,GS:.82,GX:-38,GY:20,PX:40,PY:805,PW:920,PH:570,
  YG:[875,960,1040,1120,1200],Y1:[875,945,1003,1061,1145,1220,1280,1340],Y2:[875,950,1010,1070,1160,1240,1325],
  subY:1385,subH:115,subF:36,cx:500}
 :{W:1920,H:1080,GS:1,GX:0,GY:0,PX:1170,PY:120,PW:690,PH:790,
  YG:[205,300,380,460,540],Y1:[205,290,350,420,520,620,700,780],Y2:[205,290,360,430,530,630,740],
  subY:968,subH:112,subF:40,cx:960};
for(const [k,v] of [['width',LY.W],['height',LY.H],['viewBox',`0 0 ${LY.W} ${LY.H}`]])svg.setAttribute(k,v);
const lerp=(a,b,p)=>a+(b-a)*p, easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;

// geometry
const A={x:560,y:150},B={x:170,y:860},Cc={x:1070,y:860};
const D={x:B.x+(Cc.x-B.x)*2/7,y:860}, Ept={x:A.x+(D.x-A.x)*.6,y:A.y+(D.y-A.y)*.6};
const H={x:A.x,y:860};
const dx=D.x-A.x,dy=D.y-A.y,tt=((Cc.x-A.x)*dx+(Cc.y-A.y)*dy)/(dx*dx+dy*dy);
const K={x:A.x+tt*dx,y:A.y+tt*dy};
const P=(...ps)=>ps.map(p=>p.x+','+p.y).join(' ');

// ---------- layers ----------
const geo=el('g',{transform:`translate(${LY.GX} ${LY.GY}) scale(${LY.GS})`});
const toScr=p=>[p.x*LY.GS+LY.GX,p.y*LY.GS+LY.GY];
const fABC=el('polygon',{points:P(A,B,Cc),fill:'#FFF3D6',opacity:0},geo);
const fABD=el('polygon',{points:P(A,B,D),fill:C.blueF,opacity:0},geo);
const fADC=el('polygon',{points:P(A,D,Cc),fill:C.orangeF,opacity:0},geo);
const fAEC=el('polygon',{points:P(A,Ept,Cc),fill:C.orangeF,opacity:0},geo);
const fCDE=el('polygon',{points:P(Ept,D,Cc),fill:C.greenF,opacity:0},geo);
// highlighted bases
const baseBD=el('line',{x1:B.x,y1:872,x2:D.x-6,y2:872,stroke:C.blue,'stroke-width':12,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);
const baseDC=el('line',{x1:D.x+6,y1:872,x2:Cc.x,y2:872,stroke:C.orange,'stroke-width':12,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);
// offset lines along AD (to the left of AD)
const nx=-dy/Math.hypot(dx,dy),ny=dx/Math.hypot(dx,dy),off=-16;
const baseAE=el('line',{x1:A.x+nx*off,y1:A.y+ny*off,x2:Ept.x+nx*off-dx*.01,y2:Ept.y+ny*off-dy*.01,stroke:C.orange,'stroke-width':12,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);
const baseED=el('line',{x1:Ept.x+nx*off+dx*.01,y1:Ept.y+ny*off+dy*.01,x2:D.x+nx*off,y2:D.y+ny*off,stroke:C.green,'stroke-width':12,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);

const tri=el('polygon',{points:P(A,B,Cc),fill:'none',stroke:C.ink,'stroke-width':6,'stroke-linejoin':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);
const lAD=el('line',{x1:A.x,y1:A.y,x2:D.x,y2:D.y,stroke:C.ink,'stroke-width':5,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);
const lCE=el('line',{x1:Cc.x,y1:Cc.y,x2:Ept.x,y2:Ept.y,stroke:C.ink,'stroke-width':5,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1},geo);
// ticks on BC (7) and AD (5)
const ticksBC=el('g',{opacity:0},geo);
for(let i=1;i<7;i++){if(i===2)continue;const x=B.x+(Cc.x-B.x)*i/7;el('line',{x1:x,y1:848,x2:x,y2:872,stroke:C.muted,'stroke-width':4},ticksBC);}
const ticksAD=el('g',{opacity:0},geo);
for(let i=1;i<5;i++){if(i===3)continue;const x=A.x+dx*i/5,y=A.y+dy*i/5;el('line',{x1:x-nx*12,y1:y-ny*12,x2:x+nx*12,y2:y+ny*12,stroke:C.muted,'stroke-width':4},ticksAD);}
// heights
function heightGroup(from,foot,color){
  const g=el('g',{opacity:0},geo);
  const ln=el('line',{x1:from.x,y1:from.y,x2:foot.x,y2:foot.y,stroke:color,'stroke-width':4,'stroke-dasharray':'14 10'},g);
  return g;
}
const hA=heightGroup(A,H,C.red);
el('polyline',{points:`${H.x+22},860 ${H.x+22},838 ${H.x},838`,fill:'none',stroke:C.red,'stroke-width':3.5},hA);
txt('h',{x:A.x+14,y:560,'font-size':40,fill:C.red,class:'pt'},hA);
const hC=heightGroup(Cc,K,C.red);
{const ux=(Cc.x-K.x)/Math.hypot(Cc.x-K.x,Cc.y-K.y),uy=(Cc.y-K.y)/Math.hypot(Cc.x-K.x,Cc.y-K.y),vx=-dx/Math.hypot(dx,dy),vy=-dy/Math.hypot(dx,dy),s=22;
 el('polyline',{points:`${K.x+ux*s},${K.y+uy*s} ${K.x+ux*s+vx*s},${K.y+uy*s+vy*s} ${K.x+vx*s},${K.y+vy*s}`,fill:'none',stroke:C.red,'stroke-width':3.5},hC);
 txt('h',{x:K.x+(Cc.x-K.x)*.3,y:K.y+(Cc.y-K.y)*.3-16,'font-size':40,fill:C.red,class:'pt'},hC);}
// points
function pt(p,name,lx,ly){const g=el('g',{opacity:0},geo);el('circle',{cx:p.x,cy:p.y,r:11,fill:C.gold,stroke:'#fff','stroke-width':3},g);txt(name,{x:p.x+lx,y:p.y+ly,'font-size':54,fill:C.ink,'text-anchor':'middle',class:'pt'},g);return g;}
const pA=pt(A,'A',0,-26),pB=pt(B,'B',-36,40),pC=pt(Cc,'C',38,40),pD=pt(D,'D',0,66),pE=pt(Ept,'E',-46,6);
// part labels
function lab(s,x,y,color,size=34){return txt(s,{x,y,'font-size':size,'font-weight':700,fill:color,'text-anchor':'middle',opacity:0},geo);}
const lab2=lab('2 phần',(B.x+D.x)/2,925,C.blue), lab5=lab('5 phần',(D.x+Cc.x)/2,925,C.orange);
const lab3=lab('3 phần',(A.x+Ept.x)/2+105,(A.y+Ept.y)/2+10,C.orange), lab2b=lab('2 phần',(Ept.x+D.x)/2+100,(Ept.y+D.y)/2-45,C.green);
// area labels
function areaLab(s,x,y,color,size){const g=el('g',{opacity:0},geo);txt(s,{x,y,'font-size':size,'font-weight':800,fill:color,'text-anchor':'middle'},g);return g;}
const a210=areaLab('210 cm²',700,640,C.ink,52);
const aQ=areaLab('?',760,780,C.green,70);
const a60L=areaLab('60',395,740,C.blue,54);
const a150=areaLab('150',800,700,C.orange,56);
const a60=areaLab('60 cm²',640,845,C.green,46);

// ---------- right panel ----------
const PX=LY.PX,PW=LY.PW;
const panel=el('g',{opacity:0});
el('rect',{x:PX,y:LY.PY,width:PW,height:LY.PH,rx:28,fill:C.panel,stroke:'#E8E3D8','stroke-width':3},panel);
const items=[];
function item(g,t0,t1){items.push({g,t0,t1});g.setAttribute('opacity',0);return g;}
function ptext(s,y,t0,t1,o={}){const g=el('g',{},panel);
  if(o.box){el('rect',{x:PX+30,y:y-48,width:PW-60,height:70,rx:16,fill:o.box},g);}
  txt(s,{x:PX+50,y,'font-size':o.size||36,'font-weight':o.w||400,fill:o.color||C.ink},g);return item(g,t0,t1);}
function header(s,y,t0,t1,color){const g=el('g',{},panel);
  el('rect',{x:PX+30,y:y-50,width:230,height:66,rx:33,fill:color},g);
  txt(s,{x:PX+145,y:y-5,'font-size':38,'font-weight':800,fill:'#fff','text-anchor':'middle'},g);return item(g,t0,t1);}
function boxes(n,k,y,t0,t1,c1,c2,label){const g=el('g',{},panel);const w=Math.min(80,(PW-100)/n-10);
  const bs=[];for(let i=0;i<n;i++){const b=el('g',{},g);el('rect',{x:PX+50+i*(w+10),y:y-40,width:w,height:62,rx:10,fill:i<k?c1:c2},b);
    txt(label,{x:PX+50+i*(w+10)+w/2,y:y+2,'font-size':26,'font-weight':700,fill:'#fff','text-anchor':'middle'},b);bs.push(b);}
  const it=item(g,t0,t1);it._bs=bs;it._t0=t0;return it;}
// phase 0: given
const g1=L(2),g2=L(6)-.3;
header('Đề bài',LY.YG[0],L(2),g2,C.ink);
ptext('S(ABC) = 210 cm²',LY.YG[1],L(2)+1.2,g2,{w:700});
ptext('BD : DC = 2 : 5',LY.YG[2],L(3)+.5,g2,{w:700});
ptext('AE : ED = 3 : 2',LY.YG[3],L(4)+.5,g2,{w:700});
ptext('S(CDE) = ?',LY.YG[4],L(5)+.3,g2,{w:800,color:C.green});
// phase 1
const s1=L(6),s1e=L(10)-.3;
header('Bước 1',LY.Y1[0],s1,s1e,C.blue);
ptext('ABD và ADC chung chiều cao h',LY.Y1[1],s1+1,s1e,{size:33});
ptext('→ Diện tích tỉ lệ với đáy',LY.Y1[2],L(7)+.3,s1e,{size:33});
ptext('S(ABD) : S(ADC) = 2 : 5',LY.Y1[3],L(7)+3.5,s1e,{w:700,size:34});
const bx1=boxes(7,2,LY.Y1[4],L(8)+.2,s1e,C.blue,C.orange,'30');
ptext('Mỗi phần: 210 : 7 = 30 cm²',LY.Y1[5],L(8)+3,s1e,{w:700,size:34});
ptext('S(ABD) = 2 × 30 = 60 cm²',LY.Y1[6],L(9)-.2,s1e,{size:33,color:C.blue,w:700});
ptext('S(ADC) = 5 × 30 = 150 cm²',LY.Y1[7],L(9)+1.2,s1e,{size:33,color:C.orange,w:800,box:'#FFF1E5'});
// phase 2
const s2=L(10),s2e=L(14)-.3;
header('Bước 2',LY.Y2[0],s2,s2e,C.green);
ptext('S(ADC) = 150 cm²',LY.Y2[1],s2+.6,s2e,{w:700,color:C.orange,size:34});
ptext('AEC và EDC chung chiều cao h',LY.Y2[2],L(11)+.3,s2e,{size:33});
ptext('Đáy: AE : ED = 3 : 2',LY.Y2[3],L(12)+.3,s2e,{w:700,size:34});
const bx2=boxes(5,3,LY.Y2[4],L(12)+3.6,s2e,C.orange,C.green,'30');
ptext('Mỗi phần: 150 : 5 = 30 cm²',LY.Y2[5],L(12)+6.5,s2e,{w:700,size:34});
ptext('S(CDE) = 2 × 30 = 60 cm²',LY.Y2[6],L(13)+2.5,s2e,{w:800,size:38,color:C.green,box:'#E3F5EA'});

// ---------- title & answer cards ----------
const title=el('g',{}), CX=LY.cx;
el('rect',{x:0,y:0,width:LY.W,height:LY.H,fill:C.bg},title);
if(V){ // TikTok cover: question + the given figure + monkey (drawn later)
  txt('TOÁN LỚP 5 · DIỆN TÍCH TAM GIÁC',{x:CX,y:250,'font-size':38,'font-weight':700,fill:C.orange,'text-anchor':'middle','letter-spacing':4},title);
  const q1=txt('',{x:CX,y:370,'font-size':72,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  [['Tam giác ',C.ink],['CDE',C.green],[' có diện tích',C.ink]].forEach(([w,f])=>{const ts=el('tspan',{fill:f},q1);ts.textContent=w;});
  txt('bao nhiêu cm²?',{x:CX,y:462,'font-size':72,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  const m=el('g',{transform:'translate(160 455) scale(.58)'},title);
  el('polygon',{points:P(A,B,Cc),fill:'#FFF3D6'},m);el('polygon',{points:P(Ept,D,Cc),fill:C.greenF},m);
  for(const [p,q] of [[A,D],[Cc,Ept]])el('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,stroke:C.ink,'stroke-width':7},m);
  el('polygon',{points:P(A,B,Cc),fill:'none',stroke:C.ink,'stroke-width':9,'stroke-linejoin':'round'},m);
  for(const [p,n,lx,ly] of [[A,'A',0,-30],[B,'B',-46,48],[Cc,'C',48,48],[D,'D',0,80],[Ept,'E',-56,8]]){
    el('circle',{cx:p.x,cy:p.y,r:15,fill:C.gold,stroke:'#fff','stroke-width':4},m);txt(n,{x:p.x+lx,y:p.y+ly,'font-size':70,fill:C.ink,'text-anchor':'middle',class:'pt'},m);}
  for(const [w,x,y,f] of [['2 phần',(B.x+D.x)/2,940,C.blue],['5 phần',(D.x+Cc.x)/2,940,C.orange],['3 phần',(A.x+Ept.x)/2+68,(A.y+Ept.y)/2-10,C.orange],['2 phần',(Ept.x+D.x)/2+105,(Ept.y+D.y)/2-5,C.green]])
    txt(w,{x,y,'font-size':42,'font-weight':800,fill:f,'text-anchor':'middle'},m);
  txt('210 cm²',{x:628,y:500,'font-size':52,'font-weight':800,fill:C.ink,'text-anchor':'middle'},m);
  txt('?',{x:770,y:830,'font-size':110,'font-weight':800,fill:C.green,'text-anchor':'middle'},m);}
else{txt('TOÁN LỚP 5',{x:960,y:380,'font-size':44,'font-weight':700,fill:C.orange,'text-anchor':'middle','letter-spacing':8},title);
  txt('Diện tích tam giác',{x:960,y:500,'font-size':110,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  txt('Bí kíp: chung chiều cao → so sánh đáy',{x:960,y:600,'font-size':46,fill:C.muted,'text-anchor':'middle'},title);}
const tTri=el('polygon',{points:'960,660 860,800 1060,800',fill:C.greenF,stroke:C.ink,'stroke-width':5,display:V?'none':'inline'},title);
const ans=el('g',{opacity:0});
el('rect',{x:0,y:0,width:LY.W,height:LY.H,fill:C.bg,opacity:.94},ans);
const ansCard=el('g',{},ans), ACY=V?700:460, AW=V?820:1000;
el('rect',{x:CX-AW/2,y:ACY-210,width:AW,height:420,rx:40,fill:'#fff',stroke:C.green,'stroke-width':8},ansCard);
txt('Đáp số',{x:CX,y:ACY-90,'font-size':56,'font-weight':700,fill:C.muted,'text-anchor':'middle'},ansCard);
if(V){txt('60 cm²',{x:CX,y:ACY+70,'font-size':150,'font-weight':800,fill:C.green,'text-anchor':'middle'},ansCard);
  txt('diện tích tam giác CDE',{x:CX,y:ACY+150,'font-size':48,'font-weight':700,fill:C.ink,'text-anchor':'middle'},ansCard);}
else txt('S(CDE) = 60 cm²',{x:960,y:520,'font-size':110,'font-weight':800,fill:C.green,'text-anchor':'middle'},ansCard);
const tip=el('g',{opacity:0},ans), TY=V?1010:775;
if(V){el('rect',{x:CX-430,y:TY-75,width:860,height:170,rx:50,fill:C.gold},tip);
  txt('💡 Chung chiều cao',{x:CX,y:TY-5,'font-size':50,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);
  txt('→ so sánh đáy!',{x:CX,y:TY+60,'font-size':50,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);}
else{el('rect',{x:430,y:720,width:1060,height:110,rx:55,fill:C.gold},tip);
  txt('💡 Chung chiều cao → so sánh đáy!',{x:960,y:793,'font-size':50,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);}

// ---------- monkey teaching assistant (TikTok version only) ----------
const MK={brown:'#8A5A33',dark:'#5E3B1F',tan:'#F1CFA4',pink:'#F29C9C'};
const mon=el('g',{display:V?'inline':'none'});
const monJ=el('g',{},mon);              // jump / bounce
const tailG=el('g',{},monJ);
el('path',{d:'M22,-30 C95,-25 105,-115 62,-122 C34,-126 32,-94 56,-96',fill:'none',stroke:MK.brown,'stroke-width':12,'stroke-linecap':'round'},tailG);
const legs=[-24,24].map(x=>{const g=el('g',{},monJ);el('rect',{x:-11,y:-12,width:22,height:52,rx:11,fill:MK.brown},g);
  el('ellipse',{cx:0,cy:40,rx:15,ry:10,fill:MK.tan},g);return {g,x};});
el('ellipse',{cx:0,cy:-55,rx:48,ry:60,fill:MK.brown},monJ);
el('ellipse',{cx:0,cy:-45,rx:31,ry:41,fill:MK.tan},monJ);
// props (drawn in hand space; hand at origin, arm points along +y)
function prop(kind,p){const g=el('g',{display:'none'},p);
  if(kind==='pointer'){el('line',{x1:0,y1:0,x2:0,y2:150,stroke:'#9C6B3E','stroke-width':7,'stroke-linecap':'round'},g);el('circle',{cx:0,cy:152,r:8,fill:C.red},g);}
  if(kind==='glass'){el('line',{x1:0,y1:0,x2:0,y2:34,stroke:'#3A3A3A','stroke-width':10,'stroke-linecap':'round'},g);
    el('circle',{cx:0,cy:66,r:31,fill:'rgba(190,225,255,.55)',stroke:'#3A3A3A','stroke-width':8},g);el('path',{d:'M-14,52 Q-6,44 4,46',fill:'none',stroke:'#fff','stroke-width':5,'stroke-linecap':'round'},g);}
  if(kind==='pencil'){el('rect',{x:-7,y:-10,width:14,height:62,fill:C.gold,stroke:MK.dark,'stroke-width':2},g);el('polygon',{points:'-7,52 7,52 0,72',fill:MK.tan,stroke:MK.dark,'stroke-width':2},g);
    el('rect',{x:-7,y:-20,width:14,height:11,fill:C.red},g);}
  // upright props: counter-rotated each frame

function aimAt(tx,ty,mx,my,ms,sx){const dx=tx-(mx+ms*sx),dy=ty-(my-ms*90);return Math.atan2(-dx,dy)*180/Math.PI;}
const G=(x,y)=>toScr({x,y}), CEN=G((A.x+B.x+Cc.x)/3,(A.y+B.y+Cc.y)/3);
function pose(n,t,P,tg){const w=Math.sin(t*9);
  switch(n){
    case 'wave':return {aL:150,aR:-140+22*w,pL:'sign',pR:'',mo:.7,j:0,lx:0,ly:-1,tilt:4*w,q:0};
    case 'point':return {aL:aimAt(tg[0],tg[1],...P,-38),aR:18,pL:'pointer',pR:'',mo:0,j:0,lx:-4,ly:0,tilt:-4,q:0};
    case 'think':return {aL:12,aR:128,pL:'',pR:'',mo:0,j:0,lx:3,ly:-4,tilt:9,q:1};
    case 'inspect':return {aL:aimAt(tg[0],tg[1],...P,-38)+6*Math.sin(t*1.7),aR:20,pL:'glass',pR:'',mo:0,j:0,lx:-4,ly:1,tilt:-5,q:0};
    case 'cheer':return {aL:158+10*w,aR:-158-10*w,pL:'',pR:'',mo:1,j:1,lx:0,ly:-2,tilt:0,q:0};
    case 'write':return {aL:14,aR:38+9*Math.sin(t*13),pL:'',pR:'pencil',mo:0,j:0,lx:-1,ly:4,tilt:-7,q:0};
    case 'thumb':return {aL:14,aR:-150,pL:'',pR:'check',mo:.6,j:0,lx:0,ly:0,tilt:5,q:0};
    case 'party':return {aL:150+18*w,aR:-150,pL:'',pR:'banana',mo:1,j:1,lx:0,ly:-2,tilt:5*w,q:0};}}
function monkey(t){

  const v=k=>lerp(prev[k],cur[k],b),pk=k=>b<.5?prev[k]:cur[k];

  head.setAttribute('transform',`translate(0 -150) rotate(${v('tilt')})`);

function setSub(str){subT.textContent='';const two=V&&str.length>40;

    for(let i=0;i<str.length;i++)if(str[i]===' '&&(best<0||cost(i)<cost(best)))best=i;parts=[str.slice(0,best),str.slice(best+1)];}
