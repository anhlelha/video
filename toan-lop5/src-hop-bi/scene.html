<style>
@font-face{font-family:BVP;font-weight:400;src:url(fonts/be-vietnam-pro-vietnamese-400-normal.woff2);unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

@font-face{font-family:BVP;font-weight:800;src:url(fonts/be-vietnam-pro-vietnamese-800-normal.woff2);unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}

<body>
<svg id="stage"></svg>
<script src="timings.js"></script>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('stage');
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
function txt(s,a,p){const e=el('text',a,p);e.textContent=s;return e;}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=p=>1-Math.pow(1-p,3), easeBack=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const L=i=>LS[i-1], E=i=>LS[i-1]+LD[i-1];
// time when phrase ph is spoken in line i (char-proportional estimate)
const K=(i,ph,d=0)=>{const s=SAY[i-1],k=s.indexOf(ph);if(k<0)throw new Error('K '+i+' '+ph);return L(i)+LD[i-1]*k/s.length+d;};
const C={bg:'#FBF8F1',ink:'#22252B',muted:'#6B6F78',blue:'#3B7DD8',blueF:'#CFE0F7',orange:'#E8843B',orangeF:'#FBDDC4',
  green:'#2E9E5B',greenF:'#C9EBD6',grey:'#E4E2DC',gold:'#F2B33D',red:'#D9473B',panel:'#FFFFFF'};
// layout: ?v → vertical 1080x1920 (TikTok, content kept inside UI safe zone), else 1920x1080
const V=location.search.includes('v');
const LY=V?{W:1080,H:1920,BX:[70,558],BY:330,PX:40,PY:862,PW:920,PH:510,Y0:925,DY:70,
  subY:1385,subH:115,subF:36,cx:500}
 :{W:1920,H:1080,BX:[70,558],BY:390,PX:1170,PY:120,PW:690,PH:790,Y0:205,DY:100,
  subY:968,subH:112,subF:40,cx:960};
for(const [k,v] of [['width',LY.W],['height',LY.H],['viewBox',`0 0 ${LY.W} ${LY.H}`]])svg.setAttribute(k,v);
const lerp=(a,b,p)=>a+(b-a)*p, easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;

// ---------- boxes & balls ----------
// colours: 0 trắng, 1 xanh, 2 đỏ; each colour is a 3-wide column group, filled bottom-up
const BALL=[{f:'#FFFFFF',s:'#A9AEB6',n:'trắng',lc:'#7C818B'},{f:C.blue,s:'#2A5FA8',n:'xanh',lc:C.blue},{f:C.red,s:'#A8322A',n:'đỏ',lc:C.red}];
const BW=452,BH=288,BP=24,PIT=40,R=17,GG=22, BOXN=['A','B'];
function slotXY(b,c,k,bx,by){return [bx+BP+c*(3*PIT+GG)+(k%3)*PIT+PIT/2, by+BH-BP-Math.floor(k/3)*PIT-PIT/2];}
const slot=(b,c,k)=>slotXY(b,c,k,LY.BX[b],LY.BY);
function ball(c,p,x,y){const g=el('g',x===undefined?{}:{transform:`translate(${x} ${y})`},p);
  el('circle',{r:R,fill:BALL[c].f,stroke:BALL[c].s,'stroke-width':3},g);
  el('circle',{cx:-5,cy:-6,r:5,fill:'#fff',opacity:c?.55:.0},g);return g;}
function boxShape(p,bx,by,name){
  el('rect',{x:bx,y:by,width:BW,height:BH,rx:26,fill:'#FFFDF8',stroke:'#B08A5A','stroke-width':6},p);
  el('rect',{x:bx-8,y:by-8,width:BW+16,height:22,rx:10,fill:'#C9A06A'},p);
  txt('Hộp '+name,{x:bx+BW/2,y:by-62,'font-size':44,'font-weight':800,fill:C.ink,'text-anchor':'middle'},p);}
// static full boxes (cover)
function staticBoxes(p,counts){[0,1].forEach(b=>{const bx=b*(BW+36);boxShape(p,bx,0,BOXN[b]);
  for(let c=0;c<3;c++)for(let k=0;k<counts[b][c];k++)ball(c,p,...slotXY(b,c,k,bx,0));});}

const boxL=el('g',{opacity:0}), boxW=el('g',V?{}:{transform:'translate(-5 -90) scale(1.1)'});boxW.appendChild(boxL);
[0,1].forEach(b=>boxShape(boxL,LY.BX[b],LY.BY,BOXN[b]));
// target: 8 dashed slots per colour in A
const ghost=el('g',{opacity:0},boxL);
for(let c=0;c<3;c++)for(let k=0;k<8;k++){const [x,y]=slot(0,c,k);el('circle',{cx:x,cy:y,r:R,fill:'none',stroke:C.green,'stroke-width':3,'stroke-dasharray':'6 5'},ghost);}
// count chips above each group
const cnt=[0,1].map(b=>[0,1,2].map(c=>{const x=slot(b,c,1)[0],y=LY.BY-14,g=el('g',{},boxL);
  const bg=el('rect',{x:x-38,y:y-28,width:76,height:40,rx:20,fill:'none'},g);
  const tx=txt('9',{x,y:y+2,'font-size':32,'font-weight':800,fill:BALL[c].lc,'text-anchor':'middle'},g);return {g,bg,tx};}));
const ballL=el('g',{},boxL);
const balls=[];for(let c=0;c<3;c++)for(let i=0;i<18;i++)balls.push({c,e:ball(c,ballL)});
// arrows: A→B above, B→A below
const ax0=LY.BX[0]+BW/2+110,ax1=LY.BX[1]+BW/2-110,ay=LY.BY-70;
const arTop=el('g',{opacity:0},boxL);
el('path',{d:`M${ax0},${ay} L${ax1-14},${ay}`,stroke:C.orange,'stroke-width':6,'stroke-linecap':'round'},arTop);
el('path',{d:`M${ax1-22},${ay-13} L${ax1},${ay} L${ax1-22},${ay+13}`,fill:'none',stroke:C.orange,'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},arTop);
txt('10 viên',{x:(ax0+ax1)/2,y:ay-16,'font-size':32,'font-weight':800,fill:C.orange,'text-anchor':'middle'},arTop);
const by2=LY.BY+BH+12, xb=LY.BX[1]+BW/2, xa=LY.BX[0]+BW/2, ylow=by2+78;
const arBot=el('g',{opacity:0},boxL);
el('path',{d:`M${xb},${by2} C${xb},${ylow} ${xb-60},${ylow} ${(xa+xb)/2+150},${ylow}`,fill:'none',stroke:C.green,'stroke-width':6,'stroke-linecap':'round'},arBot);
el('path',{d:`M${(xa+xb)/2-150},${ylow} C${xa+60},${ylow} ${xa},${ylow} ${xa},${by2+14}`,fill:'none',stroke:C.green,'stroke-width':6,'stroke-linecap':'round'},arBot);
el('path',{d:`M${xa-13},${by2+34} L${xa},${by2+12} L${xa+13},${by2+34}`,fill:'none',stroke:C.green,'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},arBot);
const pill=el('g',{},arBot);
const pillR=el('rect',{x:(xa+xb)/2-145,y:ylow-34,width:290,height:68,rx:34,fill:C.green},pill);
const pillT=txt('B → A: ? viên',{x:(xa+xb)/2,y:ylow+12,'font-size':36,'font-weight':800,fill:'#fff','text-anchor':'middle'},pill);
function badge(str){const g=el('g',{opacity:0},boxL),x=slot(0,0,1)[0]; // "thiếu" badge on A's white group
  el('rect',{x:x-80,y:LY.BY+BH/2-34,width:160,height:58,rx:29,fill:C.red},g);
  txt(str,{x,y:LY.BY+BH/2+6,'font-size':34,'font-weight':800,fill:'#fff','text-anchor':'middle'},g);return g;}
const flash5=badge('5 < 8'), flash=badge('7 < 8');

// ---------- ball moves ----------
// scenario = start time + moves [t0, from, to, colour, n, stagger, count(+1/-1/0)]
const SCN=[
  {t:-1,mv:[[K(6,'10 viên'),0,1,0,4,.15,0],[K(6,'10 viên',.8),0,1,1,3,.15,0],[K(6,'10 viên',1.4),0,1,2,3,.15,0]]},
  {t:L(8)-.2,mv:[[K(8,'9 viên trắng'),0,1,0,9,.2,0],[K(8,'1 viên xanh'),0,1,1,1,0,0],
    [K(10,'10 viên xanh'),1,0,1,10,.16,1],[K(10,'9 viên đỏ'),1,0,2,9,.16,1],[K(11,'Bốc thêm'),1,0,0,8,.2,1],[K(12,'26 viên'),0,1,0,1,0,-1]]},
  {t:K(13,'Thử',-.4),mv:[[K(13,'5 trắng'),0,1,0,5,.12,0],[K(13,'5 xanh'),0,1,1,5,.12,0],
    [K(13,'9 đỏ'),1,0,2,9,.1,1],[K(13,'14 xanh'),1,0,1,14,.08,1],[K(13,'4 trắng'),1,0,0,4,.12,1]]}];
const FL=.7;
function ballState(t){
  let s=SCN[0];for(const x of SCN)if(t>=x.t)s=x;
  const st=[0,1].map(b=>[0,1,2].map(c=>[...Array(9)].map((_,i)=>c*18+b*9+i)));
  const pos=balls.map((_,i)=>{const c=Math.floor(i/18),b=Math.floor(i%18/9);return slot(b,c,i%9);});
  const home=balls.map((_,i)=>Math.floor(i%18/9)), z=[];
  let n=0;const moves=[];
  for(const m of s.mv)for(let k=0;k<m[4];k++)moves.push({ts:m[0]+k*m[5],f:m[1],to:m[2],c:m[3],cn:m[6]});
  moves.sort((a,b)=>a.ts-b.ts);
  for(const m of moves){if(m.ts>t)break;
    const src=st[m.f][m.c],id=src.pop(),p0=slot(m.f,m.c,src.length),dst=st[m.to][m.c],p1=slot(m.to,m.c,dst.length);dst.push(id);
    const p=easeIO(seg(t,m.ts,m.ts+FL));
    pos[id]=[lerp(p0[0],p1[0],p),lerp(p0[1],p1[1],p)-Math.sin(Math.PI*p)*(V?150:170)];
    if(p<1){home[id]=-1;z.push(id);}else{home[id]=m.to;n+=m.cn;}}
  const cnts=[0,1].map(b=>[0,1,2].map(c=>st[b][c].filter(id=>home[id]===b).length));
  return {pos,z,n,cnts};}

// ---------- panel ----------
const PX=LY.PX,PW=LY.PW;
const panel=el('g',{opacity:0});
el('rect',{x:PX,y:LY.PY,width:PW,height:LY.PH,rx:28,fill:C.panel,stroke:'#E8E3D8','stroke-width':3},panel);
const items=[];
function item(g,t0,t1){items.push({g,t0,t1});g.setAttribute('opacity',0);return g;}
const RY=i=>LY.Y0+i*LY.DY;
function ptext(s,i,t0,t1,o={}){const g=el('g',{},panel),y=RY(i);
  if(o.box){el('rect',{x:PX+30,y:y-48,width:PW-60,height:70,rx:16,fill:o.box},g);}
  txt(s,{x:PX+50,y,'font-size':o.size||(V?36:33),'font-weight':o.w||400,fill:o.color||C.ink},g);return item(g,t0,t1);}
function header(s,t0,t1,color){const g=el('g',{},panel),y=RY(0);
  el('rect',{x:PX+30,y:y-50,width:230,height:66,rx:33,fill:color},g);
  txt(s,{x:PX+145,y:y-5,'font-size':38,'font-weight':800,fill:'#fff','text-anchor':'middle'},g);return item(g,t0,t1);}
// phase 0: given
const g2=L(5)-.3;
header('Đề bài',L(2),g2,C.ink);
ptext('Mỗi hộp: 9 trắng, 9 xanh, 9 đỏ',1,L(2)+1.5,g2,{w:700});
ptext('A → B: 10 viên (màu bất kỳ)',2,L(3)+1.5,g2,{w:700,color:C.orange});
ptext('B → A: ? viên',3,L(4)+1.5,g2,{w:800,color:C.green});
ptext('để chắc chắn A có ít nhất',4,L(4)+4,g2,{});
ptext('8 viên mỗi loại',5,L(4)+4.4,g2,{w:800,box:'#E3F5EA'});
// phase 1: A surely lacks a colour
const s1=L(5),s1e=L(7)-.3;
header('Bước 1',s1,s1e,C.orange);
ptext('A chắc chắn thiếu ít nhất 1 màu',1,s1+1,s1e,{w:700});
ptext('10 viên lấy từ 3 màu',2,K(6,'10 viên'),s1e,{});
ptext('Mỗi màu tối đa 3 → chỉ 9 viên',3,K(6,'Nếu'),s1e,{});
ptext('→ Có màu bị lấy ít nhất 4 viên',4,K(6,'Vậy'),s1e,{w:700});
ptext('Màu đó còn nhiều nhất 5 < 8',5,K(6,'Màu đó'),s1e,{w:800,color:C.red,box:'#FFF1E5'});
// phase 2: worst draw from B, on one concrete case
const s2=L(7),s2e=L(13)-.3;
header('Bước 2',s2,s2e,C.blue);
ptext('Xui nhất: bốc màu khác trước',1,s2+1,s2e,{w:700});
ptext('Thử: A → B 9 trắng + 1 xanh',2,K(8,'ta thử'),s2e,{w:700,color:C.orange});
ptext('A cần thêm 8 trắng',3,K(9,'Hộp A cần'),s2e,{});
ptext('10 + 9 = 19 viên (chưa có trắng)',4,K(10,'là 19'),s2e,{w:700});
ptext('19 + 8 trắng = 27 viên',5,K(11,'Tổng cộng'),s2e,{w:800,size:38,color:C.green,box:'#E3F5EA'});
ptext('26 viên → A có thể chỉ 7 trắng ✗',6,K(12,'Còn nếu'),s2e,{w:700,color:C.red});
// phase 3: another first move gives the same answer
const s3=L(13),s3e=L(14)-.3;
header('Bước 3',s3,s3e,C.green);
ptext('Nhận xét: nếu A chuyển kiểu khác?',1,s3+1,s3e,{});
ptext('Thử: A → B 5 trắng + 5 xanh',2,K(13,'Thử'),s3e,{w:700,color:C.orange});
ptext('A: 4 trắng, 4 xanh, 9 đỏ',3,K(13,'5 xanh',1),s3e,{w:700});
ptext('9 đỏ + 14 xanh + 4 trắng = 27',4,K(13,'9 đỏ'),s3e,{w:700});
ptext('Vẫn là 27 viên!',5,K(13,'Vẫn là'),s3e,{w:800,size:38,color:C.green,box:'#E3F5EA'});
// phase 4: why it is always 27
const s4=L(14),s4e=L(16)-.3;
header('Vì sao?',s4,s4e,C.ink);
ptext('A mất thêm 1 trắng (thay 1 xanh):',1,s4+1.5,s4e,{});
ptext('• Phải bốc thêm 1 trắng: +1',2,K(14,'thì phải'),s4e,{w:700,color:C.green});
ptext('• B bớt 1 xanh bốc nhầm: −1',3,K(14,'Nhưng'),s4e,{w:700,color:C.red});
ptext('Thêm 1, bớt 1 → vẫn 27',4,K(14,'Thêm 1'),s4e,{w:800,box:'#FFF1E5'});
ptext('Chuyển thế nào cũng ra 27!',5,L(15)+.3,s4e,{w:800,size:38,color:C.green,box:'#E3F5EA'});
ptext('Các em thử thêm vài cách nhé!',6,K(15,'Các em'),s4e,{w:700,color:C.orange});

// ---------- title & answer cards ----------
const title=el('g',{}), CX=LY.cx;
el('rect',{x:0,y:0,width:LY.W,height:LY.H,fill:C.bg},title);
if(V){ // TikTok cover: question + two boxes + monkey (drawn later)
  txt('TOÁN LỚP 5 · BÀI TOÁN BỐC BI',{x:540,y:250,'font-size':38,'font-weight':700,fill:C.orange,'text-anchor':'middle','letter-spacing':4},title);
  [['Chuyển bao nhiêu viên bi',360],['để hộp A chắc chắn có',448]].forEach(([s,y])=>txt(s,{x:540,y,'font-size':66,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title));
  const q=txt('',{x:540,y:536,'font-size':66,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  [['đủ 8 viên',C.green],[' mỗi màu?',C.ink]].forEach(([w,f])=>{const ts=el('tspan',{fill:f},q);ts.textContent=w;});
  const m=el('g',{transform:'translate(163 680) scale(.8)'},title);staticBoxes(m,[[9,9,9],[9,9,9]]);
  txt('9 trắng · 9 xanh · 9 đỏ mỗi hộp',{x:540,y:960,'font-size':40,'font-weight':700,fill:C.muted,'text-anchor':'middle'},title);}
else{txt('TOÁN LỚP 5',{x:960,y:330,'font-size':44,'font-weight':700,fill:C.orange,'text-anchor':'middle','letter-spacing':8},title);
  txt('Bài toán bốc bi',{x:960,y:450,'font-size':110,'font-weight':800,fill:C.ink,'text-anchor':'middle'},title);
  txt('Bí kíp: “chắc chắn” → nghĩ tới lúc bốc xui nhất',{x:960,y:550,'font-size':46,fill:C.muted,'text-anchor':'middle'},title);}
const tBalls=el('g',{display:V?'none':'inline'},title);
[0,1,2,1,0,2,1].forEach((c,i)=>ball(c,tBalls,780+i*60,680).setAttribute('class','tb'));
const ans=el('g',{opacity:0});
el('rect',{x:0,y:0,width:LY.W,height:LY.H,fill:C.bg,opacity:.94},ans);
const ansCard=el('g',{},ans), ACY=V?700:460, AW=V?820:1000;
el('rect',{x:CX-AW/2,y:ACY-210,width:AW,height:420,rx:40,fill:'#fff',stroke:C.green,'stroke-width':8},ansCard);
txt('Đáp số',{x:CX,y:ACY-90,'font-size':56,'font-weight':700,fill:C.muted,'text-anchor':'middle'},ansCard);
txt('27 viên bi',{x:CX,y:ACY+60,'font-size':V?140:130,'font-weight':800,fill:C.green,'text-anchor':'middle'},ansCard);
txt('chuyển từ hộp B sang hộp A',{x:CX,y:ACY+145,'font-size':V?44:48,'font-weight':700,fill:C.ink,'text-anchor':'middle'},ansCard);
const tip=el('g',{opacity:0},ans), TY=V?1010:775;
if(V){el('rect',{x:CX-430,y:TY-75,width:860,height:170,rx:50,fill:C.gold},tip);
  txt('💡 “Chắc chắn” → nghĩ tới',{x:CX,y:TY-5,'font-size':48,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);
  txt('lúc bốc xui nhất!',{x:CX,y:TY+60,'font-size':48,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);}
else{el('rect',{x:360,y:720,width:1200,height:110,rx:55,fill:C.gold},tip);
  txt('💡 “Chắc chắn” → nghĩ tới lúc bốc xui nhất!',{x:960,y:793,'font-size':48,'font-weight':800,fill:C.ink,'text-anchor':'middle'},tip);}

// ---------- monkey teaching assistant (TikTok version only) ----------
const MK={brown:'#8A5A33',dark:'#5E3B1F',tan:'#F1CFA4',pink:'#F29C9C'};
const mon=el('g',{display:V?'inline':'none'});
const monJ=el('g',{},mon);              // jump / bounce
const tailG=el('g',{},monJ);
el('path',{d:'M22,-30 C95,-25 105,-115 62,-122 C34,-126 32,-94 56,-96',fill:'none',stroke:MK.brown,'stroke-width':12,'stroke-linecap':'round'},tailG);
const legs=[-24,24].map(x=>{const g=el('g',{},monJ);el('rect',{x:-11,y:-12,width:22,height:52,rx:11,fill:MK.brown},g);
  el('ellipse',{cx:0,cy:40,rx:15,ry:10,fill:MK.tan},g);return {g,x};});
el('ellipse',{cx:0,cy:-55,rx:48,ry:60,fill:MK.brown},monJ);
el('ellipse',{cx:0,cy:-45,rx:31,ry:41,fill:MK.tan},monJ);
// props (drawn in hand space; hand at origin, arm points along +y)
function prop(kind,p){const g=el('g',{display:'none'},p);
  if(kind==='pointer'){el('line',{x1:0,y1:0,x2:0,y2:150,stroke:'#9C6B3E','stroke-width':7,'stroke-linecap':'round'},g);el('circle',{cx:0,cy:152,r:8,fill:C.red},g);}

function aimAt(tx,ty,mx,my,ms,sx){const dx=tx-(mx+ms*sx),dy=ty-(my-ms*90);return Math.atan2(-dx,dy)*180/Math.PI;}
function pose(n,t,P,tg){const w=Math.sin(t*9);
  switch(n){
    case 'wave':return {aL:150,aR:-140+22*w,pL:'sign',pR:'',mo:.7,j:0,lx:0,ly:-1,tilt:4*w,q:0};
    case 'point':return {aL:aimAt(tg[0],tg[1],...P,-38),aR:18,pL:'pointer',pR:'',mo:0,j:0,lx:-4,ly:0,tilt:-4,q:0};
    case 'think':return {aL:12,aR:128,pL:'',pR:'',mo:0,j:0,lx:3,ly:-4,tilt:9,q:1};
    case 'inspect':return {aL:aimAt(tg[0],tg[1],...P,-38)+6*Math.sin(t*1.7),aR:20,pL:'glass',pR:'',mo:0,j:0,lx:-4,ly:1,tilt:-5,q:0};
    case 'cheer':return {aL:158+10*w,aR:-158-10*w,pL:'',pR:'',mo:1,j:1,lx:0,ly:-2,tilt:0,q:0};
    case 'write':return {aL:14,aR:38+9*Math.sin(t*13),pL:'',pR:'pencil',mo:0,j:0,lx:-1,ly:4,tilt:-7,q:0};
    case 'thumb':return {aL:14,aR:-150,pL:'',pR:'check',mo:.6,j:0,lx:0,ly:0,tilt:5,q:0};
    case 'party':return {aL:150+18*w,aR:-150,pL:'',pR:'banana',mo:1,j:1,lx:0,ly:-2,tilt:5*w,q:0};}}

const GC=(b,c)=>{const p=slot(b,c,4);return [p[0],p[1]];}, BC=b=>GC(b,1);
function monkey(t){
  if(!V)return;
  // position: cover → perch under box B → answer page
  const pa=easeIO(seg(t,L(2)-.7,L(2)-.1)),pb=easeIO(seg(t,L(16)-.3,L(16)+.5));
  const P=[0,1,2].map(i=>lerp(lerp(POS.cover[i],POS.perch[i],pa),POS.ans[i],pb));
  const SEQ=[[0,'wave'],[L(2)-.4,'point',BC(0)],[L(2)+3.2,'point',BC(1)],[L(3)+1.2,'point',[540,LY.BY-90]],[L(4),'think'],
    [L(6),'inspect',BC(0)],[K(6,'Màu đó'),'point',GC(0,0)],
    [L(7),'inspect',BC(1)],[K(8,'ta thử'),'point',GC(0,0)],[L(9),'write'],[L(10),'point',[(xa+xb)/2,ylow]],
    [L(11),'write'],[K(11,'Tổng cộng'),'cheer'],[L(12),'thumb'],[K(12,'Còn nếu'),'think'],[K(12,'7 viên'),'point',GC(0,0)],
    [L(13),'think'],[K(13,'Thử'),'inspect',BC(1)],[K(13,'Vẫn là'),'cheer'],[L(14),'think'],[K(14,'Nhưng'),'point',BC(1)],
    [K(14,'Thêm 1'),'write'],[L(15),'thumb'],[K(15,'Các em'),'wave'],[L(16)-.2,'party']];
  let i=0;while(i+1<SEQ.length&&t>=SEQ[i+1][0])i++;
  const cur=pose(SEQ[i][1],t,P,SEQ[i][2]),prev=i?pose(SEQ[i-1][1],t,P,SEQ[i-1][2]):cur,b=easeIO(seg(t,SEQ[i][0],SEQ[i][0]+.4));
  const v=k=>lerp(prev[k],cur[k],b),pk=k=>b<.5?prev[k]:cur[k];
  const jy=-Math.abs(Math.sin(t*7))*26*v('j');
  mon.setAttribute('transform',`translate(${P[0]} ${P[1]}) scale(${P[2]})`);
  monJ.setAttribute('transform',`translate(0 ${jy})`);
  tailG.setAttribute('transform',`rotate(${8*Math.sin(t*2.2)} 22 -30)`);
  legs.forEach((l,k)=>l.g.setAttribute('transform',`translate(${l.x} 0) rotate(${(k?1:-1)*10*Math.sin(t*3)*(1-pb)})`));
  for(const [Ar,ang,pr] of [[armL,v('aL'),pk('pL')],[armR,v('aR'),pk('pR')]]){
    Ar.g.setAttribute('transform',`translate(${Ar.sx} -90) rotate(${ang})`);
    for(const k in Ar.props){const on=k===pr;Ar.props[k].setAttribute('display',on?'inline':'none');
      if(on){const u=Ar.props[k].querySelector('.up');if(u)u.setAttribute('transform',`rotate(${-ang})`);}}}
  head.setAttribute('transform',`translate(0 -150) rotate(${v('tilt')})`);
  const blink=((t+1.6)%3.3)<.14?.1:1;
  eyes.forEach(e=>{e.g.setAttribute('transform',`translate(${e.x} -6) scale(1 ${blink})`);e.pu.setAttribute('transform',`translate(${v('lx')} ${v('ly')})`);});
  const mo=v('mo');smile.setAttribute('opacity',1-mo);mouthO.setAttribute('opacity',mo);mouthO.setAttribute('ry',3+6*mo);
  thinkQ.setAttribute('opacity',v('q'));thinkQ.setAttribute('transform',`translate(0 ${-6*Math.sin(t*3)})`);
  speech.setAttribute('opacity',1-seg(t,L(2)-1,L(2)-.6));
  const tc=t-L(16);

}

function setSub(str){subT.textContent='';const two=V&&str.length>40;
  let parts=[str];if(two){let m=str.length/2,best=-1,cost=i=>Math.abs(i-m)-(/[:.!?,]/.test(str[i-1])||/[→]/.test(str[i+1])?12:0)+(/[+×=]/.test(str[i-1])||/[×=+]/.test(str[i+1])?12:0);
    for(let i=0;i<str.length;i++)if(str[i]===' '&&(best<0||cost(i)<cost(best)))best=i;parts=[str.slice(0,best),str.slice(best+1)];}
  const lh=LY.subF*1.3,y0=LY.subY+LY.subH/2+LY.subF*.36-(parts.length-1)*lh/2;
  parts.forEach((p,i)=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('x',subT.getAttribute('x'));ts.setAttribute('y',y0+i*lh);ts.textContent=p;subT.appendChild(ts);});}

const fade=(e,t,a,b,c,d,max=1)=>{let o=easeOut(seg(t,a,a+(b||.5)));if(c!==undefined)o*=1-seg(t,c,c+(d||.5));e.setAttribute('opacity',o*max);};

  fade(arTop,t,L(3)+1.2,.6);
